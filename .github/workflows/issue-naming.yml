name: Mithran issue naming

on:
  issues:
    types: [opened, edited, reopened]

# A caller's permissions are the CEILING for the reusable workflow it calls.
# `permissions: {}` here makes the reusable job's `issues: write` request
# unsatisfiable and the run fails at startup before any job exists.
permissions:
  issues: write

jobs:
  naming:
    # Machine-filed security findings are exempt under D172 and would otherwise
    # burn a run on every finding.
    if: ${{ !startsWith(github.event.issue.title, '[security-finding]') }}
    # The ref pinned here is the entire contract: the reusable workflow embeds
    # the normalizer source directly (mithran-hq/mithran-infra#1835 — a
    # cross-repo checkout back into mithran-infra cannot be authenticated from
    # an arbitrary caller repo), so whichever SHA this points at IS the exact
    # normalizer version that runs. There is no second ref to keep in sync.
    uses: mithran-hq/mithran-infra/.github/workflows/issue-naming-reusable.yml@0cc9a9b7949493b1d79d56ec914079b604d857d7
    with:
      known_programs: "PILOT,GOVERN,MEASURE,CLOSURE,CONNECT,ACPARCH,DELIVERY,SSALPHA"
      mode: advisory
